name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: mypy src/gagelink
      # The catch-all that keeps a fault out of the transport would also keep one out of
      # this suite, so the suite runs with it disarmed.
      - run: pytest -q
        env:
          GAGELINK_RAISE: "1"
      - name: demo runs offline
        run: python demo/freeboard.py
      - name: benchmark harness runs offline
        run: python -m bench --dry-run
      # Built and started on every push rather than only at a tag. The bundle assembles
      # from a generated manifest and a pip-resolved dependency tree, and the suite above
      # exercises neither, so without this the first sign of a broken bundle is the release.
      - name: the installable bundle assembles and starts
        run: python scripts/check_bundle.py
